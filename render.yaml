services:
  - type: web
    name: quickcart-ai
    env: python
    rootDir: "Lecture 08/code/itemprediction"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false

